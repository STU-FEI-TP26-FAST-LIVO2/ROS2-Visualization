<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROS2 Visualizer</title>

<script src="js/roslib.min.js"></script>

<style>

*,
*::before,
*::after {
  box-sizing: border-box;
  min-width: 0;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #1e1e1e;
  color: #ffffff;
  height: 100vh;
  width: 100%;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}

:root {
  --header-height: 86px;
}

header {
  height: var(--header-height);
  min-height: var(--header-height);
  box-sizing: border-box;
  background-color: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #333;
  position: relative;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 15px;
}

.nav-link {
  color: white;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
}

.nav-link:hover {
  color: #00ff88;
}

.nav-link.active {
  color: #00ff88;
  font-weight: bold;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 14px;
  color: #00ff88;
  flex-wrap: wrap;
}

button {
  background-color: #222;
  color: white;
  border: 1px solid #444;
  padding: 5px 10px;
  cursor: pointer;
}

button:hover {
  background-color: #333;
}

#burger-btn {
  display: none;
  font-size: 22px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}

.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100%;
}

.sidebar {
  background-color: #161616;
  border-right: 1px solid #333;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mobile-only {
  display: none;
}

.main-view {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 10px;
  width: 100%;
  height: 100%;
}

.left-panels {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
  min-width: 0;
}

.panel {
  background-color: black;
  border: 1px solid #333;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

.panel-title {
  background-color: #111;
  padding: 6px;
  font-size: 13px;
  border-bottom: 1px solid #333;
}

.viewer {
  flex: 1;
  min-height: 0px;
  height: 100%;
}

#viewer,
#map-view {
  width: 100%;
  height: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  position: relative;
}

#viewer canvas,
#map-view canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

#viewer canvas:active,
#map-view canvas:active {
  cursor: grabbing;
}

#camera-view {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  text-align: center;
  background-color: #111;
  position: relative;
}

#camera-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

#camera-placeholder {
  position: absolute;
  color: #aaa;
  font-size: 14px;
}

#recordings-page {
  display: none;
  padding: 20px;
}

.recording-item {
  padding: 10px;
  border-bottom: 1px solid #333;
  cursor: pointer;
}

.recording-item:hover {
  background-color: #333;
}

.ros-block {
  display: flex;
  align-items: center;
  color: #00ff88;
  gap: 5px;
}

@media (max-width: 1100px) {
  .main-view {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {

  .mobile-only {
    display: block;
  }

  header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto;
      padding: 6px 10px;
      gap: 6px;
    }
    
  .header-left {
      grid-row: 1;
      grid-column: 2;
      justify-content: center;
    }

  .site-title {
    text-align: center;
    font-size: 15px;
    width: auto;
    white-space: nowrap;
  }

  .nav-links {
    display: none;
  }

  .header-right {
    grid-row: 2;
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    font-size: 12px;
  }

  .header-left-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-right-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  #burger-btn {
    display: block;
    font-size: 22px;
  }

  .ros-block {
    white-space: nowrap;
    margin: 0;
    color: #00ff88;
  }

  #start-record,
  #stop-record {
    font-size: 12px;
    padding: 6px 8px;
    white-space: nowrap;
  }

  .container {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: fixed;
    top: var(--header-height);
    left: -280px;
    width: 260px;
    height: calc(100vh - var(--header-height));
    z-index: 1000;
    transition: left 0.3s ease;
    overflow-y: auto;
  }

  .sidebar.open {
    left: 0;
  }

  #viewer {
    width: 100%;
  }
  
  .viewer {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: 100%;
  }
  
  .panel {
    display: none;
  }
  
  .left-panels {
      display: block;
      height: 100%;
    }


  .panel.active {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .panel.active .viewer {
    height: 100%;
    min-height: 0;
  }

  #viewer.active,
  #map-view.active {
    display: block;
  }

  #camera-view.active {
    display: flex;
  }
  
  #toggle-lidar,
    #toggle-camera,
    #toggle-map {
      pointer-events: none;
      opacity: 0.4;
    }
}

@media (min-width: 701px) {

  #viewer,
  #camera-view,
  #map-view {
    display: block;
  }

  #camera-view {
    display: flex;
  }

  .left-panels {
    display: grid;
  }
}

.mobile-only .nav-link {
  display: block;
  width: 100%;
  padding: 8px 0;
}

</style>

</head>

<body>

<header>

<div class="header-left">
<span class="site-title">Multisenzorická vizualizácia</span>

<nav class="nav-links">
<a id="nav-live" class="nav-link active">Live</a>
<a id="nav-recordings" class="nav-link">Recordings</a>
</nav>
</div>


<div class="header-right">

  <div class="header-left-controls">
    <button id="burger-btn">☰</button>

    <div class="ros-block">
      ROS:
      <span id="ros-status">connected</span>
    </div>
  </div>

  <div class="header-right-controls">
    <button id="start-record">Start Record</button>
    <button id="stop-record">Stop Record</button>
  </div>

</div>

</header>

<div class="container">

<div class="sidebar">

<div class="mobile-only">
  <h3>Menu</h3>
  <a id="sidebar-live" class="nav-link">Live</a>
  <a id="sidebar-recordings" class="nav-link">Recordings</a>
  <hr>
</div>

<div class="mobile-only">
  <h3>View</h3>

  <label>
    <input type="radio" name="mobile-view" value="lidar" checked>
    LiDAR
  </label><br>

  <label>
    <input type="radio" name="mobile-view" value="camera">
    Camera
  </label><br>

  <label>
    <input type="radio" name="mobile-view" value="map">
    Map
  </label>

  <hr>
</div>

<h3>Layers</h3>

<label><input type="checkbox" id="toggle-lidar" checked> LiDAR</label>
<label><input type="checkbox" id="toggle-map" checked> Map</label>
<label><input type="checkbox" id="toggle-camera" checked> Camera</label>
<label><input type="checkbox" id="toggle-grid" checked> Grid</label>

<hr>

<h4>Status:</h4>
<pre id="output">Waiting for LiDAR, map and camera...</pre>

</div>

<div id="main-page" class="main-view">

<div class="left-panels">

<div id="map-panel" class="panel">
<div class="panel-title">MAP</div>
<div id="map-view" class="viewer"></div>
</div>

<div id="camera-panel" class="panel">
<div class="panel-title">CAMERA</div>
<div id="camera-view" class="viewer">
  <img id="camera-image" alt="Camera stream">
  <div id="camera-placeholder">Camera preview</div>
</div>
</div>

</div>

<div id="lidar-panel" class="panel">
<div class="panel-title">LIDAR</div>
<div id="viewer" class="viewer"></div>
</div>

</div>

<div id="recordings-page">
<h2>Recordings</h2>
<div class="recording-item">Recording_01</div>
<div class="recording-item">Recording_02</div>
<div class="recording-item">Recording_03</div>
</div>

</div>

<script type="module">
import * as THREE from './js/three.module.js';
import { OrbitControls } from './js/OrbitControls.js';

/* ROS */

const ros = new ROSLIB.Ros({
  url: 'ws://localhost:9090'
});

const rosStatus = document.getElementById("ros-status");
const output = document.getElementById("output");
const cameraImage = document.getElementById("camera-image");
const cameraPlaceholder = document.getElementById("camera-placeholder");
const startButton = document.getElementById("start-record");
const stopButton = document.getElementById("stop-record");

let lidarPointCount = 0;
let mapPointCount = 0;
let cameraFrameReceived = false;
let systemState = "idle";

function updateStatus(extraMessage = "") {
  output.textContent =
    `ROS: ${rosStatus.textContent}\n` +
    `System: ${systemState}\n` +
    `LiDAR topic: /lidar_points\n` +
    `LiDAR points: ${lidarPointCount}\n` +
    `Map topic: /map_points\n` +
    `Map points: ${mapPointCount}\n` +
    `Camera topic: /camera_image/compressed\n` +
    `Camera: ${cameraFrameReceived ? "receiving" : "waiting"}` +
    (extraMessage ? `\n${extraMessage}` : "");
}

ros.on('connection', function() {
  rosStatus.textContent = "connected";
  updateStatus();
});

ros.on('error', function(error) {
  rosStatus.textContent = "error";
  console.error("ROS connection error:", error);
  updateStatus("ROS connection error");
});

ros.on('close', function() {
  rosStatus.textContent = "closed";
  updateStatus("ROS connection closed");
});

/* Services */

const startService = new ROSLIB.Service({
  ros: ros,
  name: '/start_system',
  serviceType: 'std_srvs/srv/Trigger'
});

const stopService = new ROSLIB.Service({
  ros: ros,
  name: '/stop_system',
  serviceType: 'std_srvs/srv/Trigger'
});

startButton.addEventListener("click", () => {
  const request = new ROSLIB.ServiceRequest({});

  updateStatus("Calling /start_system ...");
  console.log("Calling /start_system ...");

  startService.callService(
    request,
    function(result) {
      console.log("Start response:", result);
      updateStatus(`START: ${result.message}`);
    },
    function(error) {
      console.error("Start service failed:", error);
      updateStatus("START ERROR");
    }
  );
});

stopButton.addEventListener("click", () => {
  const request = new ROSLIB.ServiceRequest({});

  updateStatus("Calling /stop_system ...");
  console.log("Calling /stop_system ...");

  stopService.callService(
    request,
    function(result) {
      console.log("Stop response:", result);
      updateStatus(`STOP: ${result.message}`);
    },
    function(error) {
      console.error("Stop service failed:", error);
      updateStatus("STOP ERROR");
    }
  );
});

/* UI status subscriber */

const uiStatusTopic = new ROSLIB.Topic({
  ros: ros,
  name: '/ui/status',
  messageType: 'std_msgs/msg/String'
});

uiStatusTopic.subscribe(function(message) {
  systemState = message.data;
  updateStatus();
});

/* Shared helper */

function getFieldOffset(fields, fieldName) {
  const field = fields.find(f => f.name === fieldName);
  return field ? field.offset : null;
}

function decodePointCloud2(message) {
  if (!message.data || !message.fields || !message.point_step) {
    return [];
  }

  const xOffset = getFieldOffset(message.fields, "x");
  const yOffset = getFieldOffset(message.fields, "y");
  const zOffset = getFieldOffset(message.fields, "z");

  if (xOffset === null || yOffset === null || zOffset === null) {
    return [];
  }

  let rawData;

  if (typeof message.data === "string") {
    const binary = atob(message.data);
    rawData = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      rawData[i] = binary.charCodeAt(i);
    }
  } else {
    rawData = new Uint8Array(message.data);
  }

  const dv = new DataView(rawData.buffer);
  const points = [];

  for (let i = 0; i + message.point_step <= rawData.length; i += message.point_step) {
    const x = dv.getFloat32(i + xOffset, true);
    const y = dv.getFloat32(i + yOffset, true);
    const z = dv.getFloat32(i + zOffset, true);

    if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
      points.push(x, z, -y);
    }
  }

  return points;
}

/* LIDAR VIEWER */

const viewer = document.getElementById("viewer");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  75,
  viewer.clientWidth / viewer.clientHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewer.clientWidth, viewer.clientHeight);
renderer.domElement.style.touchAction = "none";
viewer.appendChild(renderer.domElement);
viewer.addEventListener("contextmenu", (e) => e.preventDefault());

camera.position.set(0, 12, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = true;
controls.enableRotate = true;
controls.enablePan = true;
controls.minDistance = 1;
controls.maxDistance = 200;
controls.target.set(0, 0, 0);
controls.update();

const grid = new THREE.GridHelper(20, 20);
scene.add(grid);

const axes = new THREE.AxesHelper(2);
scene.add(axes);

let currentCloud = null;

/* MAP VIEWER */

const mapViewer = document.getElementById("map-view");
const mapScene = new THREE.Scene();
mapScene.background = new THREE.Color(0x111111);

const mapCamera = new THREE.PerspectiveCamera(
  75,
  mapViewer.clientWidth / mapViewer.clientHeight,
  0.1,
  2000
);

const mapRenderer = new THREE.WebGLRenderer({ antialias: true });
mapRenderer.setSize(mapViewer.clientWidth, mapViewer.clientHeight);
mapRenderer.domElement.style.touchAction = "none";
mapViewer.appendChild(mapRenderer.domElement);
mapViewer.addEventListener("contextmenu", (e) => e.preventDefault());

mapCamera.position.set(0, 20, 35);

const mapControls = new OrbitControls(mapCamera, mapRenderer.domElement);
mapControls.enableDamping = true;
mapControls.dampingFactor = 0.08;
mapControls.enableZoom = true;
mapControls.enableRotate = true;
mapControls.enablePan = true;
mapControls.minDistance = 1;
mapControls.maxDistance = 500;
mapControls.target.set(0, 0, 0);
mapControls.update();

const mapGrid = new THREE.GridHelper(40, 40);
mapScene.add(mapGrid);

const mapAxes = new THREE.AxesHelper(2);
mapScene.add(mapAxes);

let currentMapCloud = null;

function animate() {
  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene, camera);

  mapControls.update();
  mapRenderer.render(mapScene, mapCamera);
}
animate();

/* UI toggles */

document.getElementById("toggle-grid").addEventListener("change", e => {
  grid.visible = e.target.checked;
  mapGrid.visible = e.target.checked;
});

document.getElementById("toggle-map").addEventListener("change", e => {
  document.getElementById("map-view").style.display =
    e.target.checked ? "block" : "none";
});

document.getElementById("toggle-camera").addEventListener("change", e => {
  document.getElementById("camera-view").style.display =
    e.target.checked ? "flex" : "none";
});

document.getElementById("toggle-lidar").addEventListener("change", e => {
  document.getElementById("viewer").style.display =
    e.target.checked ? "block" : "none";
});

/* BURGER */

const burgerBtn = document.getElementById("burger-btn");
const sidebar = document.querySelector(".sidebar");

burgerBtn.onclick = () => {
  sidebar.classList.toggle("open");
};

/* PAGE SWITCH */

function showLive() {
  document.getElementById("main-page").style.display = "grid";
  document.getElementById("recordings-page").style.display = "none";
  sidebar.classList.remove("open");
}

function showRecordings() {
  document.getElementById("main-page").style.display = "none";
  document.getElementById("recordings-page").style.display = "block";
  sidebar.classList.remove("open");
}

document.getElementById("nav-live").onclick = showLive;
document.getElementById("nav-recordings").onclick = showRecordings;
document.getElementById("sidebar-live").onclick = showLive;
document.getElementById("sidebar-recordings").onclick = showRecordings;

/* Resize */

window.addEventListener("resize", () => {
  const w = viewer.clientWidth || 1;
  const h = viewer.clientHeight || 1;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);

  const mw = mapViewer.clientWidth || 1;
  const mh = mapViewer.clientHeight || 1;

  mapCamera.aspect = mw / mh;
  mapCamera.updateProjectionMatrix();
  mapRenderer.setSize(mw, mh);
});

/* LiDAR subscriber */

const lidarTopic = new ROSLIB.Topic({
  ros: ros,
  name: '/lidar_points',
  messageType: 'sensor_msgs/msg/PointCloud2'
});

lidarTopic.subscribe(function(message) {
  const points = decodePointCloud2(message);

  if (points.length === 0) {
    return;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(points, 3)
  );

  const material = new THREE.PointsMaterial({
    size: 0.06
  });

  const cloud = new THREE.Points(geometry, material);

  if (currentCloud) {
    scene.remove(currentCloud);
    currentCloud.geometry.dispose();
    currentCloud.material.dispose();
  }

  currentCloud = cloud;
  scene.add(currentCloud);

  lidarPointCount = points.length / 3;
  updateStatus();
});

/* MAP subscriber */

const mapTopic = new ROSLIB.Topic({
  ros: ros,
  name: '/map_points',
  messageType: 'sensor_msgs/msg/PointCloud2'
});

mapTopic.subscribe(function(message) {
  const points = decodePointCloud2(message);

  if (points.length === 0) {
    return;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(points, 3)
  );

  const material = new THREE.PointsMaterial({
    size: 0.04
  });

  const cloud = new THREE.Points(geometry, material);

  if (currentMapCloud) {
    mapScene.remove(currentMapCloud);
    currentMapCloud.geometry.dispose();
    currentMapCloud.material.dispose();
  }

  currentMapCloud = cloud;
  mapScene.add(currentMapCloud);

  mapPointCount = points.length / 3;
  updateStatus();
});

const cameraTopic = new ROSLIB.Topic({
  ros: ros,
  name: '/camera_image/compressed',
  messageType: 'sensor_msgs/msg/CompressedImage'
});

cameraTopic.subscribe(function(message) {
  if (!message.data) {
    return;
  }

  let imageSrc = "";

  if (typeof message.data === "string") {
    imageSrc = "data:image/jpeg;base64," + message.data;
  } else {
    let binary = "";
    const bytes = new Uint8Array(message.data);
    const len = bytes.byteLength;

    for (let i = 0; i < len; i++) {
      binary += String.fromCharCode(bytes[i]);
    }

    imageSrc = "data:image/jpeg;base64," + btoa(binary);
  }

  cameraImage.src = imageSrc;
  cameraImage.style.display = "block";
  cameraPlaceholder.style.display = "none";

  cameraFrameReceived = true;
  updateStatus();
});


const mobileRadios = document.querySelectorAll(
  'input[name="mobile-view"]'
);

function setMobileView(view) {

  if (window.innerWidth > 700) return;

  const lidarPanel = document.getElementById("lidar-panel");
  const cameraPanel = document.getElementById("camera-panel");
  const mapPanel = document.getElementById("map-panel");

  const lidar = document.getElementById("viewer");
  const cameraView = document.getElementById("camera-view");
  const map = document.getElementById("map-view");

  [lidarPanel, cameraPanel, mapPanel]
    .forEach(p => p.classList.remove("active"));

  if (view === "lidar")
    lidarPanel.classList.add("active");

  if (view === "camera")
    cameraPanel.classList.add("active");

  if (view === "map")
    mapPanel.classList.add("active");

  sidebar.classList.remove("open");

  requestAnimationFrame(() => {

    let activeViewer;

    if (view === "lidar")
      activeViewer = lidar;

    if (view === "map")
      activeViewer = map;

    if (view === "camera")
      activeViewer = cameraView;

    if (!activeViewer) return;

    const w = activeViewer.clientWidth || 1;
    const h = activeViewer.clientHeight || 1;

    if (view === "lidar") {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(window.devicePixelRatio)
    }

    if (view === "map") {
      mapCamera.aspect = w / h;
      mapCamera.updateProjectionMatrix();
      mapRenderer.setSize(w, h);
      mapRenderer.setPixelRatio(window.devicePixelRatio)
    }
  });
}

mobileRadios.forEach(radio => {
  radio.addEventListener("change", e => {
    setMobileView(e.target.value);
  });
});


if (window.innerWidth <= 700) {
  setMobileView("lidar");
}

document.getElementById("lidar-panel").classList.add("active");

updateStatus();

window.addEventListener("load", () => {

  if (window.innerWidth <= 700) {
    setMobileView("lidar");
  }

  window.dispatchEvent(new Event("resize"));

});

</script>

</body>
</html>
