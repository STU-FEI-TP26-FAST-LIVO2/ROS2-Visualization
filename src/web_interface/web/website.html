<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROS2 Visualizer</title>

<script src="js/roslib.min.js"></script>

<style>


*,
*::before,
*::after {
  box-sizing: border-box;
  min-width: 0;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #1e1e1e;
  color: #ffffff;

  min-height: 100vh;
  width: 100%;
  overflow-x: hidden;

  display: grid;
  grid-template-rows: auto 1fr;
}

:root {
  --header-height: 96px;
}

header {
  height: var(--header-height);
  min-height: var(--header-height);
  box-sizing: border-box;
}

header {
  background-color: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 20px;
  border-bottom: 1px solid #333;

  position: relative;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 15px;
}

.nav-link {
  color: white;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
}

.nav-link:hover {
  color: #00ff88;
}

.nav-link.active {
  color: #00ff88;
  font-weight: bold;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 14px;
  color: #00ff88;
}

button {
  background-color: #222;
  color: white;
  border: 1px solid #444;
  padding: 5px 10px;
  cursor: pointer;
}

button:hover {
  background-color: #333;
}

/* BURGER */

#burger-btn {
  display: none;
  font-size: 22px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}

/* LAYOUT */

.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100%;
}

/* SIDEBAR */

.sidebar {
  background-color: #161616;
  border-right: 1px solid #333;

  padding: 15px;

  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* MOBILE MENU ITEMS */

.mobile-only {
  display: none;
}

/* PANELS */

.main-view {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  padding: 10px;

  width: 100%;
  max-width: 100%;
}

.left-panels {
  display: grid;
  grid-template-rows: auto auto;
  gap: 10px;

  width: 100%;
  max-width: 100%;
  min-width: 0;
}

.panel {
  background-color: black;
  border: 1px solid #333;
  border-radius: 6px;

  display: flex;
  flex-direction: column;
}

.panel {
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

.panel-title {
  background-color: #111;
  padding: 6px;
  font-size: 13px;
  border-bottom: 1px solid #333;
}

.viewer {
  flex: 1;
}

#viewer {
  width: 100%;
  height: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
}

#map-view,
#camera-view {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  max-width: 100%;
  min-width: 0;

  overflow: hidden;
  text-align: center;
}

#map-view {
  background-color: #222;
}

#camera-view {
  background-color: #400;
}

#recordings-page {
  display: none;
  padding: 20px;
}

.recording-item {
  padding: 10px;
  border-bottom: 1px solid #333;
  cursor: pointer;
}

.recording-item:hover {
  background-color: #333;
}

.ros-block {
  display: flex;
  align-items: center;
  color: #00ff88;
  gap: 5px;
}

.header-right {
  flex-wrap: wrap;
}

/* TABLET */

@media (max-width: 1100px) {
  .main-view {
    grid-template-columns: 1fr;
  }
}

/* MOBILE */

@media (max-width: 700px) {

  .mobile-only {
      display: block;
    }

  header {
    display: grid;
    grid-template-rows: auto auto;
    padding: 6px 8px;
    gap: 6px;
  }

  .header-left {
    justify-content: center;
  }

  .site-title {
    width: 100%;
    text-align: center;
    font-size: 14px;
    white-space: nowrap;
  }

  .nav-links {
    display: none;
  }

  .header-right {
    display: grid;
    grid-template-columns: auto auto 1fr auto auto;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }

  #burger-btn {
    display: block;
    font-size: 22px;
  }

  .ros-block {
    white-space: nowrap;
    margin: 0;
    color: #00ff88;
  }

  #start-record,
  #stop-record {
    font-size: 12px;
    padding: 6px 8px;
    white-space: nowrap;
  }

  .container {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: fixed;
    top: var(--header-height);
    left: -280px;
    width: 260px;
    height: calc(100vh - var(--header-height));
    z-index: 1000;
    transition: left 0.3s ease;
    overflow-y: auto;
  }

  .sidebar.open {
    left: 0;
  }
}

.mobile-only .nav-link {
  display: block;
  width: 100%;
  padding: 8px 0;
}

</style>

</head>

<body>

<header>

<div class="header-left">

<span class="site-title">
Multisenzorická vizualizácia
</span>

<nav class="nav-links">

<a id="nav-live"
   class="nav-link active">
Live
</a>

<a id="nav-recordings"
   class="nav-link">
Recordings
</a>

</nav>

</div>

<div class="header-right">

<button id="burger-btn">
☰
</button>

<div class="ros-block">

ROS:
<span id="ros-status">connecting...</span>

</div>

<button id="start-record">
Start Record
</button>

<button id="stop-record">
Stop Record
</button>

</div>

</header>

<div class="container">

<div class="sidebar">

<!-- MOBILE MENU -->

<div class="mobile-only">

  <h3>Menu</h3>

  <a id="sidebar-live" class="nav-link">
    Live
  </a>

  <a id="sidebar-recordings" class="nav-link">
    Recordings
  </a>

  <hr>

</div>

<h3>Layers</h3>

<label>
<input type="checkbox" id="toggle-lidar" checked>
LiDAR
</label>

<label>
<input type="checkbox" id="toggle-map" checked>
Map
</label>

<label>
<input type="checkbox" id="toggle-camera" checked>
Camera
</label>

<label>
<input type="checkbox" id="toggle-grid" checked>
Grid
</label>

<hr>

<h4>Status:</h4>

<pre id="output"></pre>

</div>

<div id="main-page" class="main-view">

<div class="left-panels">

<div class="panel">

<div class="panel-title">
MAP
</div>

<div id="map-view" class="viewer">
Map preview
</div>

</div>

<div class="panel">

<div class="panel-title">
CAMERA
</div>

<div id="camera-view" class="viewer">
Camera preview
</div>

</div>

</div>

<div class="panel">

<div class="panel-title">
LIDAR
</div>

<div id="viewer" class="viewer"></div>

</div>

</div>

<div id="recordings-page">

<h2>Recordings</h2>

<div class="recording-item">
Recording_01
</div>

<div class="recording-item">
Recording_02
</div>

<div class="recording-item">
Recording_03
</div>

</div>

</div>

<script type="module">

import * as THREE from './js/three.module.js';
import { OrbitControls } from './js/OrbitControls.js';

/* ROS */

var ros = new ROSLIB.Ros({
  url: 'ws://localhost:9090'
});

ros.on('connection', function() {

  document.getElementById("ros-status")
  .textContent = "connected";

});

ros.on('error', function() {

  document.getElementById("ros-status")
  .textContent = "error";

});

/* VIEWER */

const viewer =
document.getElementById("viewer");

var scene = new THREE.Scene();

var camera = new THREE.PerspectiveCamera(
  75,
  viewer.clientWidth / viewer.clientHeight,
  0.1,
  1000
);

var renderer =
new THREE.WebGLRenderer();

renderer.setSize(
  viewer.clientWidth,
  viewer.clientHeight
);

viewer.appendChild(renderer.domElement);

camera.position.set(5,5,5);

const controls =
new OrbitControls(camera, renderer.domElement);

var grid =
new THREE.GridHelper(10,10);

scene.add(grid);

document
.getElementById("toggle-grid")
.addEventListener("change", e => {
  grid.visible = e.target.checked;
});

document
.getElementById("toggle-map")
.addEventListener("change", e => {

  document.getElementById("map-view")
  .style.display = e.target.checked
    ? "flex"
    : "none";
});

document
.getElementById("toggle-camera")
.addEventListener("change", e => {

  document.getElementById("camera-view")
  .style.display = e.target.checked
    ? "flex"
    : "none";
});

document
.getElementById("toggle-lidar")
.addEventListener("change", e => {

  document.getElementById("viewer")
  .style.display = e.target.checked
    ? "block"
    : "none";
});

/* BURGER */

const burgerBtn =
document.getElementById("burger-btn");

const sidebar =
document.querySelector(".sidebar");

burgerBtn.onclick = () => {

  console.log("burger clicked");

  sidebar.classList.toggle("open");

};

/* PAGE SWITCH */

function showLive(){

  document.getElementById("main-page")
  .style.display="grid";

  document.getElementById("recordings-page")
  .style.display="none";

  sidebar.classList.remove("open");

}

function showRecordings(){

  document.getElementById("main-page")
  .style.display="none";

  document.getElementById("recordings-page")
  .style.display="block";

  sidebar.classList.remove("open");

}

/* HEADER */

document
.getElementById("nav-live")
.onclick = showLive;

document
.getElementById("nav-recordings")
.onclick = showRecordings;

/* SIDEBAR MOBILE */

document
.getElementById("sidebar-live")
.onclick = showLive;

document
.getElementById("sidebar-recordings")
.onclick = showRecordings;

/* SYNC ROS STATUS */

function syncStatus(){

  document.getElementById("sidebar-ros")
  .textContent =
  document.getElementById("ros-status")
  .textContent;

}

setInterval(syncStatus,500);

window.addEventListener("resize", () => {

  const w = viewer.clientWidth;
  const h = viewer.clientHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

</script>

</body>

</html>
