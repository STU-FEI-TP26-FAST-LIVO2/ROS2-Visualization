<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ROS2 Visualizer</title>
  <script src="js/roslib.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #111;
      padding: 15px 20px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background-color: #161616;
      border-right: 1px solid #333;
      padding: 15px;
    }

    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .view-window {
      flex: 1;
      background-color: #000;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px;
      overflow: auto;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
      color: #00ff88;
    }
  </style>
</head>

<body>

  <header>
    <h1 style="text-align:center;">Multisenzorická odometrická vizualizácia</h1>
  </header>

  <div class="container">

    <div class="sidebar">
      <h3>Menu</h3>

      <h4>Status:</h4>
      <pre id="output">Čakám na dáta...</pre>

    </div>

    <div class="main-view">
      <h3>PointCloud View</h3>

      <div class="view-window" id="viewer">
      </div>
    </div>

  </div>

  <script type="module">
    import * as THREE from './js/three.module.js';
    import { OrbitControls } from './js/OrbitControls.js';

    var ros = new ROSLIB.Ros({
      url: 'ws://localhost:9090'
    });

    ros.on('connection', function() {
      console.log('Connected to rosbridge');
    });

    ros.on('error', function(error) {
      console.log('Connection error:', error);
    });

    var listener = new ROSLIB.Topic({
      ros: ros,
      name: '/chatter',
      messageType: 'std_msgs/msg/String'
    });

    listener.subscribe(function(message) {
      document.getElementById('output').textContent = message.data;
    });

    const viewer = document.getElementById("viewer");
    var scene = new THREE.Scene();

    var camera = new THREE.PerspectiveCamera(
      75,
      viewer.clientWidth / viewer.clientHeight,
      0.1,
      1000
    );

    var renderer = new THREE.WebGLRenderer();
    renderer.setPixelRatio(window.devicePixelRatio);

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    viewer.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {

    camera.aspect =
      viewer.clientWidth /
      viewer.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    });

    camera.position.set(5, 5, 5);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    var grid = new THREE.GridHelper(10, 10);
    scene.add(grid);

    var geometry = new THREE.BufferGeometry();

    var points = [];

    for (let i = 0; i < 2000; i++) {

      let x = (Math.random() - 0.5) * 10;
      let y = (Math.random() - 0.5) * 10;
      let z = Math.random() * 2;

      points.push(x, y, z);

    }

    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(points, 3)
    );

    var material = new THREE.PointsMaterial({
      size: 0.05,
      color: 0x00ff88
    });

    var pointCloud = new THREE.Points(
      geometry,
      material
    );

    scene.add(pointCloud);

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      renderer.render(scene, camera);
    }

    animate();
  </script>

</body>
</html>
